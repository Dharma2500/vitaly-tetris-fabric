name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build mod
        run: ./gradlew --no-daemon build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: vitaly-tetris-fabric-0.1.0
          path: build/libs/vitaly-tetris-fabric-0.1.0.jar
          if-no-files-found: error
          retention-days: 14
